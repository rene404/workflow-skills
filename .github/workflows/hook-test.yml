name: hook-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hook-test:
    strategy:
      matrix:
        # macOS ships bash 3.2, Ubuntu bash 5: the hook must work on both.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run hook tests
        # /bin first so `bash` is the system bash (3.2 on macOS), not Homebrew's.
        run: |
          export PATH="/bin:/usr/bin:$PATH"
          bash --version | head -1
          bash tests/hook-test.sh
